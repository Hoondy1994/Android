  <text x="200" y="687" text-anchor="middle" font-size="10" fill="#94a3b8">&#x6570;&#x636E;&#x5355;&#x6B21;&#x62F7;&#x8D1D; &#xB7; &#x5F15;&#x7528;&#x8BA1;&#x6570; &#xB7; &#x7EBF;&#x7A0B;&#x8C03;&#x5EA6;</text>

